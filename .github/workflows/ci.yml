name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    # Pull requests from this repository are already linted by the push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Check lint rules
        run: ruff check --output-format=github .
      - name: Check formatting
        # Run even if linting fails, to report both kinds of problem at once.
        if: ${{ !cancelled() }}
        run: ruff format --check --diff .

  test:
    # Pull requests from this repository are already tested by the push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the package
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel and run the smoke test
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/python "$GITHUB_WORKSPACE/tests/smoke_test.py"
