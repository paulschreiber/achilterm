# Builds the project website from README.md with Jekyll.
image: ruby:3.3

default:
  before_script:
    - bundle install

# Checks that the site builds on other branches, without publishing it.
test-pages:
  script:
    - bundle exec jekyll build
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

create-pages:
  pages:
    # The folder that contains the files to be exposed at the Page URL
    publish: _site
  rules:
    # Only pushes to the default branch deploy the site
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - bundle exec jekyll build
