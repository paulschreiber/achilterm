[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[project]
name = "achilterm-ng"
version = "0.30"
description = "A lightweight UTF-8 web based terminal, forked from Achilterm"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["COPYING"]
authors = [{ name = "Florent Gallaire", email = "fgallaire@gmail.com" }]
maintainers = [{ name = "Paul Schreiber" }]
keywords = ["sh", "shell", "bash", "terminal"]
classifiers = [
    "Development Status :: 6 - Mature",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: System :: Shells",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = ["webob>=1.8.11"]

[dependency-groups]
dev = ["pre-commit==4.7.0", "ruff==0.17.6"]

[project.urls]
Homepage = "https://paulschreiber.github.io/achilterm/"
Source = "https://github.com/paulschreiber/achilterm"
Issues = "https://github.com/paulschreiber/achilterm/issues"

[project.scripts]
achilterm = "achilterm.achilterm:main"

[tool.uv.build-backend]
module-name = "achilterm"
module-root = ""
# Installed relative to the environment's prefix, for the man page.
data = { data = "data" }
source-include = ["achilterm.service", "img/**", "tests/**"]
