[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "achilterm-ng"
dynamic = ["version"]
description = "A lightweight UTF-8 web based terminal, forked from Achilterm"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["COPYING"]
authors = [{ name = "Florent Gallaire", email = "fgallaire@gmail.com" }]
maintainers = [{ name = "Paul Schreiber" }]
keywords = ["sh", "shell", "bash", "terminal"]
classifiers = [
    "Development Status :: 6 - Mature",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: System :: Shells",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = ["webob>=1.8.9"]

[dependency-groups]
dev = ["pre-commit==4.7.0", "ruff==0.17.6"]

[project.urls]
Homepage = "https://paulschreiber.github.io/achilterm/"
Source = "https://github.com/paulschreiber/achilterm"
Issues = "https://github.com/paulschreiber/achilterm/issues"

[project.scripts]
achilterm = "achilterm.achilterm:main"

[tool.setuptools]
packages = ["achilterm"]

[tool.setuptools.package-data]
achilterm = ["*.js", "*.html", "*.css"]

[tool.setuptools.data-files]
"share/man/man1" = ["achilterm.1"]

[tool.setuptools.dynamic]
# Read from the source without importing it, so building needs no dependencies.
version = { attr = "achilterm.achilterm.__version__" }
